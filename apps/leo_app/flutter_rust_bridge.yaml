# FRB 2.13 path contract when codegen runs from apps/leo_app:
# - rust_root is relative to dart_root (the Flutter app directory).
# - rust_output is relative to rust_root (the Rust crate root).
# - dart_output is relative to base_dir (the repository root).
# Keep rust_output inside core/bridge/src so FRB's Rust module prefix matches.
base_dir: ../..
rust_input: crate::api
rust_root: ../../core/bridge
rust_output: src/frb_generated.rs
dart_output: apps/leo_app/lib/src/rust
dart_root: .
type_64bit_int: true
default_dart_async: true
