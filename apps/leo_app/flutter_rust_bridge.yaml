# FRB 2.13 derives base_dir from this config file's parent (apps/leo_app).
# rust_root is canonicalized from that directory. Do not declare the Rust output path:
# FRB then builds it from the canonical rust_root/src directory, avoiding a
# lexical ../../ path that fails its internal strip_prefix check.
rust_input: crate::api
rust_root: ../../core/bridge
dart_output: lib/src/rust
dart_root: .
type_64bit_int: true
default_dart_async: true
