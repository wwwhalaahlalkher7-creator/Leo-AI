# FRB 2.13 path contract when codegen runs from apps/leo_app:
# - rust_root and rust_output are resolved from dart_root (the Flutter app).
# - dart_output is resolved from base_dir (the repository root).
# Both Rust paths must point to the same canonical bridge crate.
base_dir: ../..
rust_input: crate::api
rust_root: ../../core/bridge
rust_output: ../../core/bridge/src/frb_generated.rs
dart_output: apps/leo_app/lib/src/rust
dart_root: .
type_64bit_int: true
default_dart_async: true
