name: Leo CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate version and release channel
        run: python scripts/check_version.py
      - name: Verify immutable source archives
        run: python scripts/verify_sources.py
      - name: Test architecture, version and native ABI contracts
        run: python -m unittest discover -s scripts/tests -v

  full-stack:
    needs: foundation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEO_REQUIRE_LOCKFILES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android,x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install pinned cargo-expand required by FRB
        run: cargo install cargo-expand --version 1.0.126 --locked
      - name: Verify pinned cargo-expand
        shell: bash
        run: test "$(cargo expand --version | tail -n 1 | tr -d '\r')" = "cargo-expand 1.0.126"
      - name: Install pinned Flutter Rust Bridge generator
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - name: Resolve Flutter dependencies and generate typed bridge
        run: bash scripts/generate_bridge.sh
      - name: Verify generated bridge outputs
        shell: bash
        run: |
          test -s core/bridge/src/frb_generated.rs
          test -s apps/leo_app/lib/src/rust/frb_generated.dart
          test -s apps/leo_app/lib/src/rust/frb_generated.io.dart
          test -s apps/leo_app/lib/src/rust/frb_generated.web.dart
      - name: Publish generated bridge for platform jobs
        uses: actions/upload-artifact@v4
        with:
          name: leo-frb-generated-bindings
          path: |
            core/bridge/src/frb_generated.rs
            apps/leo_app/lib/src/rust/
          if-no-files-found: error
          retention-days: 1
      - name: Format Dart files
        working-directory: apps/leo_app
        run: dart format .
      - name: Commit Dart formatting changes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- apps/leo_app; then
            echo 'Dart formatting is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- apps/leo_app
          git commit -m 'style: format Dart sources'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Verify Dart formatting
        working-directory: apps/leo_app
        run: dart format --output=none --set-exit-if-changed .
      - name: Flutter analyze
        working-directory: apps/leo_app
        run: flutter analyze --fatal-infos
      - name: Flutter tests
        working-directory: apps/leo_app
        run: flutter test --reporter compact
      - name: Rust format check
        run: cargo fmt --all -- --check
      - name: Rust unit tests
        run: cargo test --workspace --locked
      - name: Android ARM64 Rust type-check
        run: cargo check --package leo-runtime --target aarch64-linux-android --locked
      - name: Windows x64 Rust type-check
        run: cargo check --package leo-runtime --target x86_64-pc-windows-msvc --locked
      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  android-app:
    name: Android ARM64 debug + release qualification build
    needs: full-stack
    runs-on: ubuntu-latest
    env:
      LEO_REQUIRE_LOCKFILES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require committed reproducible dependency lockfiles
        run: python scripts/check_dependency_lockfiles.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install pinned Android SDK, NDK and CMake
        shell: bash
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1" "platform-tools"
          NDK_PATH="$ANDROID_HOME/ndk/30.0.16248370"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LATEST_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
      - name: Install Ninja and native build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install pinned cargo-expand required by FRB
        run: cargo install cargo-expand --version 1.0.126 --locked
      - name: Verify pinned cargo-expand
        shell: bash
        run: test "$(cargo expand --version | tail -n 1 | tr -d '\r')" = "cargo-expand 1.0.126"
      - name: Install pinned Flutter Rust Bridge generator
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - name: Checkout pinned llama.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: cd959bae99ff4bed22bef2604f45241c09bbb8c8
          path: third_party/llama.cpp
      - name: Build and verify Android ARM64 debug + release APKs
        env:
          LEO_ANDROID_BUILD_MODE: both
        run: bash scripts/build_android_app.sh
      - name: Upload Android ARM64 qualification APKs and native checksums
        uses: actions/upload-artifact@v4
        with:
          name: leo-alpha-android-arm64-qualification
          path: |
            apps/leo_app/build/app/outputs/flutter-apk/app-debug.apk
            apps/leo_app/build/app/outputs/flutter-apk/app-release.apk
            apps/leo_app/build/app/outputs/flutter-apk/SHA256SUMS.txt
            build/android-native/arm64-v8a/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  windows-app:
    name: Windows x64 debug application + local native runtime
    needs: full-stack
    runs-on: windows-latest
    env:
      LEO_REQUIRE_LOCKFILES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require committed reproducible dependency lockfiles
        run: python scripts/check_dependency_lockfiles.py
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Checkout pinned llama.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: cd959bae99ff4bed22bef2604f45241c09bbb8c8
          path: third_party/llama.cpp
      - name: Download generated Flutter Rust Bridge files
        uses: actions/download-artifact@v4
        with:
          name: leo-frb-generated-bindings
          path: .
      - name: Verify generated bridge files
        shell: pwsh
        run: |
          if (-not (Test-Path 'core/bridge/src/frb_generated.rs')) {
            throw 'Generated Rust bridge file is missing from the Linux codegen artifact.'
          }
          foreach ($binding in @('frb_generated.dart', 'frb_generated.io.dart', 'frb_generated.web.dart')) {
            if (-not (Test-Path "apps/leo_app/lib/src/rust/$binding")) {
              throw "Generated Dart bridge file $binding is missing from the Linux codegen artifact."
            }
          }
      - name: Prepare Windows runner and resolve Flutter dependencies
        shell: pwsh
        run: |
          ./scripts/prepare_windows_runner.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows runner preparation failed.' }
          Push-Location apps/leo_app
          try {
            flutter pub get --enforce-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Flutter dependency lockfile validation failed.' }
          } finally {
            Pop-Location
          }
      - name: Build Windows x64 native llama.cpp backend
        shell: pwsh
        run: ./scripts/build_windows_native.ps1
      - name: Build Windows x64 debug application
        working-directory: apps/leo_app
        run: flutter build windows --debug
      - name: Package Windows native backend beside executable
        shell: pwsh
        run: |
          $runner = 'apps/leo_app/build/windows/x64/runner/Debug'
          New-Item -ItemType Directory -Path $runner -Force | Out-Null
          Copy-Item 'build/windows-native/x64/leo_llama_backend.dll' $runner -Force
          Copy-Item 'build/windows-native/x64/SHA256SUMS.txt' $runner -Force
      - name: Upload Windows debug directory
        uses: actions/upload-artifact@v4
        with:
          name: leo-alpha-windows-x64-debug
          path: apps/leo_app/build/windows/x64/runner/Debug/
          if-no-files-found: error
          retention-days: 14
