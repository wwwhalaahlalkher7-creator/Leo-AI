name: leo_platform_capabilities
description: Small, OS-first native capability adapters for Leo on Android and Windows.
publish_to: none
version: 0.12.0

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.1'

flutter:
  plugin:
    platforms:
      android:
        package: ai.leo.platform.capabilities
        pluginClass: LeoPlatformCapabilitiesPlugin
      windows:
        pluginClass: LeoPlatformCapabilitiesPluginCApi
