[workspace]
resolver = "2"
members = [
    "core/shared",
    "core/runtime",
    "core/orchestration",
    "core/memory",
    "core/capabilities",
    "core/bridge",
]

[workspace.package]
version = "0.27.0"
edition = "2021"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
